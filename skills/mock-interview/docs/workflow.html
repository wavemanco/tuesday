<div id="detail">Click any box above to see the details for that step.</div>

<script>
const D = {
 web: "<b>Web — claude.ai.</b> One-time prerequisite: code execution must be on — Settings → Capabilities on Free/Pro/Max plans; on Team/Enterprise an owner enables Code execution and Skills under Organization settings → Skills. Then Customize → Skills, upload the zip (the zip root must be the <code>mock-interview/</code> folder itself), and toggle it on. Uploaded skills are private to your account unless an org owner provisions them organization-wide.",
 desktop: "<b>Desktop app.</b> Skills are account-level, so anything enabled on claude.ai is already available here — manage them from Customize in the sidebar. Shortcut: when someone shares the packaged <code>.skill</code> file in a chat, its file card shows a Save skill button. Cowork sessions sync the skills enabled on your account at session start, so the account-level install is the one that counts there.",
 cli: "<b>Claude Code (CLI).</b> Pure filesystem. Personal: copy <code>mock-interview/</code> into <code>~/.claude/skills/</code> — available in every project. Project: commit it to <code>.claude/skills/</code> in the repo and everyone who clones gets it. New sessions pick it up automatically, and the skill is also invokable directly as <code>/mock-interview</code>.",
 installed: "<b>Installed and discoverable.</b> Claude reads only each skill's name and description at session start; the full instructions load when a request matches. That's why there's no activation step beyond the toggle — and why the description is written to catch phrases like \u201cprep me for my interview.\u201d",
 prompt: "<b>Your first prompt.</b> The ideal version front-loads what the skill would otherwise ask: \u201cPrep me for my interview at Acme for the GTM Lead role — 60 minutes with Dana Park, who'd be my peer. JD and CV attached.\u201d The bare minimum (\u201chelp me prep, final round at Canva for a Senior Program Manager role\u201d) also works — you'll just get the setup question first and more [inferred] labels.",
 trigger: "<b>Auto-triggering.</b> You don't have to name the skill — the request matching its description is enough. Name it explicitly (or use <code>/mock-interview</code> in Claude Code) only when you have overlapping skills installed and want to disambiguate.",
 setup: "<b>The one setup question.</b> If round type/relationship or your documents are missing, the skill sends exactly one message with at most three questions — and proceeds even if you ignore it. It never asks for anything it can research, never gates on optional inputs, and never solicits sensitive material.",
 research: "<b>Research tiers.</b> L0 uses only what you provided. L1 (the default) runs a handful of targeted searches: the company's official values, its documented interview loop, one recent-strategy sweep, and the interviewer's public footprint if you named one. L2 deep research is offered once, with its search caps and time cost stated, and runs only if you say yes. Anything research can't attribute to your specific company is dropped and said plainly, never guessed.",
 pack: "<b>The delivered pack.</b> A markdown file: fit-gap map against the JD, an interviewer read (when known), persona-weighted question banks where every question carries answer guidance + rationale + a provenance label ([grounded]/[inferred]/[generic]), a values cheat sheet when a values-style round is detected and the published values are in hand, reverse questions, and an upgrade menu listing exactly which missing input unlocks what.",
 drill: "<b>Drill mode.</b> One optional offer after the pack: Claude adopts a chosen persona and runs a live rehearsal with follow-ups that react to your actual answers, then breaks character and scores you against the pack's own rubric — what landed, what to change, one line worth stealing. This is where delivery flaws actually surface.",
 provide: "<b>What you provide.</b> Required: company + role — the only hard gate. Sharpens: the JD text and your CV or background (without a JD you get representative-JD questions; with no background at all — no CV and nothing stated — the fit snapshot becomes a self-assessment worksheet). Optional: interviewer profile, round schedule, a research note, a working-style assessment. Never upload government IDs — the skill refuses them by design."
};
function show(k){ document.getElementById('detail').innerHTML = D[k]; }
</script>
