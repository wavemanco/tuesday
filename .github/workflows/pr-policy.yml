name: pr-policy

# The early-repository policy in CONTRIBUTING.md ("Pull requests"): only
# collaborators can open pull requests, for now. The repository's pull-request
# setting enforces that; this workflow is the backstop if the setting is ever
# off, and closes any other with a comment that points there and to issues.
#
# pull_request_target runs in the base repository's context, so it can close a
# pull request opened from a fork. It never checks out or runs the pull
# request's code, which is what keeps that context safe; keep it that way.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close-outside-pull-requests:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Close with the reason
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for this. The repository is early: its skills' contracts, shared conventions and eval harness still change week to week, so for now only collaborators can open pull requests (CONTRIBUTING.md, \"Pull requests\"). Please open an issue instead: ideas, bug reports and failures you hit using a skill are all welcome there."
